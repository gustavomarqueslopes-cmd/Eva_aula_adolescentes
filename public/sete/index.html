ge{max-width:1500px;margin:auto;min-height:calc(100vh - 165px);display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding:35px clamp(20px,5vw,85px);position:relative}.stage h1{font:800 clamp(48px,6vw,90px)/.98 'Space Grotesk';letter-spacing:-.065em;margin:20px 0}.stage h1 em{font-style:normal;color:var(--a)}.stage .lead{font-size:clamp(18px,2vw,25px);line-height:1.45;color:#d2e2ed}.quote{border-left:4px solid var(--a);background:#173147aa;color:#d5edf5;padding:17px 20px;border-radius:0 12px 12px 0;line-height:1.65;margin:25px 0}.avatar-wrap{position:relative;display:grid;place-items:center;min-height:440px}.orbit{position:absolute;width:400px;height:400px;border:1px solid #81dded65;border-radius:100%;animation:rotate 21s linear infinite;box-shadow:0 0 75px #4cc6cd33}.orbit.two{width:340px;height:340px;border-style:dashed;animation-direction:reverse;animation-duration:31s}.orbit.three{width:280px;height:280px;border-color:#edc79677;animation-duration:42s}.face{width:310px;filter:drop-shadow(0 0 30px #69c9f277);animation:float 5s ease-in-out infinite}.speaking .mouth{animation:talk .25s alternate infinite;transform-origin:center}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes talk{to{transform:scaleY(1.8)}}.footer{border-top:1px solid #26445a;display:flex;justify-content:space-between;gap:13px;flex-wrap:wrap;padding:16px 4vw;position:relative}.meters{display:flex;gap:14px;flex-wrap:wrap}.meters span{font-size:11px}.bars{display:flex;gap:4px;margin-top:7px}.bars b{width:26px;height:7px;background:#3d5163;border-radius:5px}.bars b.on{background:#6ce6cc}.layout{display:grid;grid-template-columns:245px 1fr;min-height:95vh}.layout.collapsed{grid-template-columns:65px 1fr}.sidebar{border-right:1px solid #294d62;background:#0a1928;padding:18px 10px;display:flex;flex-direction:column;gap:10px}.sidebar .side{padding:12px;background:#16334a;border:1px solid #33536b;border-radius:8px;color:white;text-align:left}.collapsed .hide{display:none}.content{padding:30px clamp(16px,3vw,45px)}h2,h3{font-family:'Space Grotesk';letter-spacing:-.02em}h1{font-family:'Space Grotesk'}.content h1{font-size:clamp(28px,4vw,44px);margin:10px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid #30516a;background:linear-gradient(140deg,#10243a,#101c2e);padding:23px;border-radius:16px;position:relative}.card h2{margin:0 0 17px;font-size:19px}.scene-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.scene-button{background:#152e43;color:#d5e7f1;border:1px solid #335772;border-radius:9px;padding:11px;text-align:left;font-size:11px}.scene-button strong{display:block;font-size:13px;margin:5px 0;color:#fff}.scene-button.active{border-color:#83e7ed;background:#18536b}.small{font-size:12px;line-height:1.6;color:var(--muted)}.teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.teamcard{border:1px solid #3e5e74;background:#163248;border-radius:12px;padding:15px}.teamcard h3{font-size:17px}.field{width:100%;background:#09192a;border:1px solid #4c718a;color:#fff;padding:13px;border-radius:9px;font-size:15px}.alert{border-left:3px solid #deb17a;background:#46302564;padding:13px;border-radius:8px;color:#ffe3ba;line-height:1.6;font-size:13px}.ok{border-left:3px solid #61d8b9;background:#14443899;padding:13px;border-radius:8px;color:#dcfff5;line-height:1.6;font-size:13px}.mobile{max-width:650px;margin:auto;padding:25px 18px 70px;position:relative}.mobile h1{font-size:45px;letter-spacing:-.05em;margin:6px 0}.flags{display:flex;gap:8px;flex-wrap:wrap}.flags span{border:1px solid #3c5d76;border-radius:9px;padding:10px;background:#19334a}.movie{position:fixed;inset:0;background:#030915f9;display:grid;place-items:center;text-align:center;z-index:99;padding:30px}.movie-inner{max-width:900px;animation:reveal 1.1s ease-out}.movie h2{font-size:clamp(45px,7vw,90px);line-height:1.05}.movie[hidden]{display:none}@keyframes reveal{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}@media(max-width:1000px){.stage{grid-template-columns:1fr}.avatar-wrap{grid-row:1;min-height:240px}.face{width:200px}.orbit{width:240px;height:240px}.orbit.two{width:210px;height:210px}.orbit.three{width:180px;height:180px}.columns{grid-template-columns:1fr}.teams{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.stage h1{font-size:43px}.layout,.layout.collapsed{display:block}.sidebar{position:sticky;top:0;z-index:20;flex-direction:row;flex-wrap:wrap;padding:8px}.sidebar .side{padding:8px}.scene-buttons,.teams{grid-template-columns:1fr}.home h1{font-size:51px}}

<script>
(function(){
'use strict';
var N={A:'VOZES',B:'LIMITES',C:'VERDADE',D:'CAMINHOS'};
var T={A1:'Todo mundo aprovou?',B1:'Autorizou o quê?',C1:'Quem criou e quem apresentou?',D1:'Leia até a última linha',A2:'O print perdeu uma parte',B2:'A confirmação que nunca veio',C2:'A marca que ninguém notou',D2:'A porta ainda está aberta?',A3:'Como conversar sem virar tribunal',B3:'Reconhecer sem expor',C3:'A revisão que realmente resolve',D3:'E se a resposta for não?'};
var H={"A1":"c1c30a8c","B1":"28cfb6e0","C1":"f10d428f","D1":"59317ffb","A2":"b2b76ea9","B2":"eeba215a","C2":"8eb74994","D2":"c5d42cc8","A3":"d13b1a3a","B3":"c244b583","C3":"b578b0c2","D3":"4ab07a3f"};
var C={A1:'A aprovação foi para um teste interno, não para publicar.',B1:'Autorizar um teste não é autorizar a exposição pública.',C1:'Sete apresentou, mas não criou o projeto sozinho.',D1:'O prazo final era 17h. Solicitar correção não garante aprovação.',A2:'O print não mostrava a conversa toda.',B2:'Lia queria reconhecimento sem exposição de foto e perfil.',C2:'A versão agendada ainda era um rascunho.',D2:'Uma errata poderia ser solicitada.',A3:'O caminho começa ouvindo e confirmando informações.',B3:'É possível dar crédito sem expor a pessoa.',C3:'A divulgação precisa reconhecer a equipe.',D3:'Um plano alternativo preserva o propósito.'};
var S=[
['RECEPÇÃO','E se a resposta certa não fosse suficiente?','Quatro equipes. Uma história. Escolhas que parecem óbvias — até surgir a próxima pista.','Bem-vindos à EVA. Hoje vocês não vão apenas ouvir. Vão investigar uma história. O desafio não é ser o mais rápido. É enxergar os detalhes.'],
['O CASO','Conheçam o Sete.','16 anos. Uma ideia boa. Uma oportunidade que pode mudar tudo.','Este é o Sete. Ele tem dezesseis anos e ajudou a criar o Projeto Ponte, com atividades para outros adolescentes. O projeto foi escolhido para uma mostra. É uma ótima notícia. Mas existem informações que não combinam.'],
['QUATRO ARQUIVOS','A verdade está dividida.','Cada grupo recebeu um arquivo. Nenhum conhece a história inteira.','Vocês serão divididos em quatro equipes. Vozes, Limites, Verdade e Caminhos. O que cada grupo encontra pode transformar o entendimento dos outros.'],
['RODADA 1','Nem tudo que parece provado foi provado.','Abram os primeiros envelopes e prestem atenção ao contexto.','Primeira rodada liberada. Abram os envelopes A um, B um, C um e D um. Observem os detalhes de cada documento.'],
['RODADA 2','Faltava um pedaço.','Uma informação verdadeira pode enganar quando está incompleta.','Chegaram novas evidências. Algumas conclusões anteriores precisam ser revistas. Abram os envelopes da segunda rodada.'],
['REVELAÇÃO','A informação que mudou tudo.','Aprovar um teste interno não é autorizar divulgação pública.','Atenção, equipes. Acabei de receber uma atualização. Lia autorizou uma arte em um teste interno, mas pediu que sua foto e seu perfil não fossem divulgados. O resumo anterior não contava toda a história.'],
['A PALAVRA','O que governa a sua escolha?','Marcos 10:17 a 27. Conhecimento e transformação não são a mesma coisa.','Vamos interromper a investigação. Abram a Bíblia em Marcos, capítulo dez, versículos dezessete a vinte e sete. Prestem atenção no amor de Jesus, no apego do jovem e na graça de Deus.'],
['RODADA 3','Não basta encontrar. É hora de construir.','Uma proposta responsável deve preservar a verdade e as pessoas.','Abram os terceiros envelopes. Agora vocês precisam criar soluções, não apenas encontrar palavras.'],
['PROTOCOLO','Quatro partes. Uma decisão.','A solução precisa reunir as descobertas de todas as equipes.','Chegou a hora do Protocolo Ponte. Cada equipe precisa apresentar pelo menos uma evidência e construir a solução com os outros.'],
['DESFECHO','Escolher bem não é controlar o resultado.','A integridade não depende de vencer uma seleção.','A decisão está tomada. A verdade e o cuidado com as pessoas são importantes, mesmo quando não sabemos se a oportunidade será mantida.'],
['ENCERRAMENTO','E agora, quem está no controle?','O que ocupa o primeiro lugar no coração?','Vocês perceberam como detalhes e expectativas mudam decisões. Jesus não nos chama a fingir perfeição. Ele nos chama a segui-lo.']
];
var K='eva-caso-sete-previa-v1',bc,app=document.getElementById('app'),collapse=false,speaking=false;
function newState(){return {id:'ENSAIO-'+Math.random().toString(36).slice(2,7).toUpperCase(),scene:0,round:0,finalReleased:false,outcome:'',progress:{A:[false,false,false],B:[false,false,false],C:[false,false,false],D:[false,false,false]},hints:{A:0,B:0,C:0,D:0},log:[]}}
function get(){try{var d=JSON.parse(localStorage.getItem(K));if(d&&d.progress)return d}catch(e){}return newState()}
var state=get();if(!localStorage.getItem(K))localStorage.setItem(K,JSON.stringify(state));
try{bc=new BroadcastChannel(K);bc.onmessage=function(){state=get();render()}}catch(e){}
window.addEventListener('storage',function(e){if(e.key===K){state=get();render()}});window.addEventListener('hashchange',render);
function esc(s){return String(s).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
function route(){return decodeURIComponent(location.hash.replace(/^#\/?/,'')||'inicio')}
function save(msg){if(msg){state.log.unshift(new Date().toLocaleTimeString('pt-BR')+' · '+msg);state.log=state.log.slice(0,10)}localStorage.setItem(K,JSON.stringify(state));if(bc)bc.postMessage('sync');render()}
function normal(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
function btn(t,a,cls){return '<button class="btn '+(cls||'')+'" data-action="'+a+'">'+t+'</button>'}
function label(){return '<div class="banner"><b>MODO ENSAIO ONLINE:</b> sincronização somente entre abas do mesmo navegador. Celulares diferentes exigem o servidor do workshop.</div>'}
function brand(){return '<div class="brand">E<i>·</i>V<i>·</i>A</div>'}
function bars(t){return '<div class="bars">'+state.progress[t].map(function(x){return '<b class="'+(x?'on':'')+'"></b>'}).join('')+'</div>'}
function avatar(){return '<div class="avatar-wrap"><div class="orbit"></div><div class="orbit two"></div><div class="orbit three"></div><svg class="face '+(speaking?'speaking':'')+'" viewBox="0 0 320 360" role="img" aria-label="Avatar futurista da EVA"><defs><linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7faff"/><stop offset=".6" stop-color="#76a8ef"/><stop offset="1" stop-color="#e7b9f1"/></linearGradient></defs><path d="M160 28 C81 25 67 108 79 206 C91 282 127 315 160 333 C209 312 244 265 247 184 C250 93 220 29 160 28 Z" stroke="url(#f)" stroke-width="3" fill="#0a304a"/><path d="M103 152 Q125 167 148 153 M178 153 Q202 168 222 151" stroke="#c5faff" stroke-width="4" fill="none"/><circle cx="124" cy="155" r="4" fill="white"/><circle cx="200" cy="155" r="4" fill="white"/><path d="M160 161 L150 221 L173 222" stroke="#7ae7f2" stroke-width="3" fill="none"/><path class="mouth" d="M130 263 Q161 280 191 261" stroke="#c3ffff" stroke-width="5" fill="none"/><path d="M75 334 Q25 339 15 359 H304 Q295 335 239 334" fill="#143957" stroke="#7ae9ee" stroke-width="2"/></svg></div>'}
function header(){return '<header class="top">'+brand()+'<div><span class="chip">O CASO SETE · PROJETO PONTE</span> &nbsp; <a class="btn" href="#/inicio">Início</a></div></header>'}
function home(){return label()+'<main class="home"><div class="kicker">WORKSHOP CRISTÃO · QUATRO EQUIPES · 100 MINUTOS</div>'+brand()+'<h1>QUEM ESTÁ<br><em>NO CONTROLE?</em></h1><p>Uma única história. Quatro arquivos. Doze enigmas. Cada equipe tem uma parte da verdade.</p><div class="actions"><a class="btn primary" href="cenas/">🎬 Reproduzir EVA com voz</a><a class="btn" href="#/telao">◈ Abrir telão</a><a class="btn" href="#/controle">▣ Controle do professor</a><a class="btn" href="#/equipe/A">⌁ Terminal de equipe</a></div><p class="small">Prévia sem servidor: use várias abas no mesmo navegador para ensaiar. Para quatro celulares reais, utilize a versão local com servidor.</p></main>'}
function stage(){var s=S[state.scene];var lead=s[2];if(state.scene===9){if(state.outcome==='A')lead='A organização recebeu o pedido de revisão. A seleção ainda não está garantida.';else if(state.outcome==='B')lead='O pedido não foi aceito. O Projeto Ponte seguirá por outro caminho.';else lead='Aguardando o professor escolher o desfecho.'}
return label()+header()+'<main class="stage"><section><div class="kicker">'+s[0]+' / EVA · TRANSMISSÃO</div><h1>'+esc(s[1]).replace(/(Sete|controle|dividida|pedaço|mudou tudo|escolha|construir|decisão|resultado)/i,'<em>$1</em>')+'</h1><p class="lead">'+esc(lead)+'</p><blockquote class="quote">'+esc(s[3])+'</blockquote><div class="actions">'+btn('◉ Ouvir EVA','voice','primary')+'<a class="btn" href="cenas/">🎬 Cenas narradas da EVA</a>'+btn('⛶ Tela cheia','full')+'</div></section>'+avatar()+'</main><footer class="footer"><div class="meters">'+Object.keys(N).map(function(t){return '<span><strong>'+t+' · '+N[t]+'</strong>'+bars(t)+'</span>'}).join('')+'</div><a href="#/controle">Abrir controle ↗</a></footer>'}
function control(){return label()+'<div class="layout '+(collapse?'collapsed':'')+'"><aside class="sidebar">'+brand()+'<button class="side" data-action="collapse">☰ <span class="hide">Minimizar menu</span></button><a class="side" href="#/telao">▣ <span class="hide">Abrir telão</span></a><button class="side" data-action="full">⛶ <span class="hide">Tela cheia</span></button><button class="side" data-action="reset">↻ <span class="hide">Nova sessão</span></button></aside><main class="content"><div class="kicker">CENTRAL DO MINISTRANTE · '+state.id+'</div><h1>Controle da investigação</h1><p class="small">Este painel é livre no modo ensaio. No modo presencial use o servidor local com PIN.</p><div class="columns"><section class="card"><h2>01 · Cenas da EVA</h2><div class="scene-buttons">'+S.map(function(x,i){return '<button class="scene-button '+(state.scene===i?'active':'')+'" data-scene="'+i+'">'+String(i+1).padStart(2,'0')+' · '+x[0]+'<strong>'+esc(x[1])+'</strong></button>'}).join('')+'</div><div class="actions">'+btn('← Voltar','prev')+btn('Próxima →','next','primary')+btn('◉ Narrar','voice')+'</div></section><section class="card"><h2>02 · Envelopes e desfechos</h2><p class="small">Somente libere o material depois de entregar o envelope físico.</p><div class="scene-buttons">'+[0,1,2,3].map(function(r){return '<button class="scene-button '+(state.round===r?'active':'')+'" data-round="'+r+'"><strong>'+(r?'Rodada '+r:'Bloqueado')+'</strong>'+(r?'A'+r+', B'+r+', C'+r+', D'+r:'Início da aula')+'</button>'}).join('')+'</div><p><label class="small"><input type="checkbox" id="final" '+(state.finalReleased?'checked':'')+'> Liberar envelope final</label></p><h3>Desfecho do Projeto Ponte</h3><div class="scene-buttons"><button data-outcome="A" class="scene-button '+(state.outcome==='A'?'active':'')+'"><strong>A · Revisão recebida</strong></button><button data-outcome="B" class="scene-button '+(state.outcome==='B'?'active':'')+'"><strong>B · Caminho alternativo</strong></button></div></section></div><section class="card" style="margin-top:16px"><h2>03 · Quatro equipes</h2><div class="teams">'+Object.keys(N).map(function(t){return '<div class="teamcard"><div class="kicker">EQUIPE '+t+'</div><h3>'+N[t]+'</h3>'+bars(t)+'<p class="small">'+state.progress[t].filter(Boolean).length+'/3 arquivos</p><select class="field" data-hint="'+t+'">'+[0,1,2,3].map(function(n){return '<option '+(n===state.hints[t]?'selected':'')+' value="'+n+'">'+(n?'Dica nível '+n:'Nenhuma dica')+'</option>'}).join('')+'</select><p><a href="#/equipe/'+t+'">Abrir terminal ↗</a></p></div>'}).join('')+'</div></section><section class="card" style="margin-top:16px"><h2>04 · Registro da sessão</h2><p class="small">'+(state.log.map(esc).join('<br>')||'Nenhuma ação registrada.')+'</p></section></main></div>'}
function team(t){if(!N[t])return home();var done=state.progress[t],n=done.findIndex(function(x){return !x})+1,key=t+n,locked=!n||n>state.round,tips=['','Procurem o detalhe que limita a afirmação mais forte.','Observem datas e para quem cada mensagem foi enviada.','Compararem todas as evidências. Qual interpretação continua verdadeira?'];return label()+'<main class="mobile">'+header()+'<div class="kicker" style="margin-top:35px">TERMINAL DE INVESTIGAÇÃO</div><h1>'+N[t]+'</h1><p class="muted">Equipe '+t+' · Sessão '+state.id+'</p><div class="card"><div class="kicker">SEUS ARQUIVOS</div><div class="flags" style="margin:18px 0">'+[1,2,3].map(function(i){return '<span>'+(done[i-1]?'✓':i<=state.round?'◉':'🔒')+' '+t+i+'</span>'}).join('')+'</div>'+(locked?'<div class="alert">'+(done.every(Boolean)?'Três arquivos concluídos! Aguardem o envelope final.':'Esperem a EVA liberar a próxima rodada.')+'</div>':'<h2>ARQUIVO '+key+' · '+T[key]+'</h2><p class="muted">Encontrem o código no envelope físico. Nenhuma resposta aparece antecipadamente aqui.</p><label class="small" for="answer">CÓDIGO DA EQUIPE</label><input class="field" id="answer" autocapitalize="characters" autocomplete="off" placeholder="Palavra-chave"><div class="actions">'+btn('Validar evidência','submit','primary')+'</div><div id="feedback" aria-live="polite"></div>'+(state.hints[t]?'<div class="alert">DICA '+state.hints[t]+': '+tips[state.hints[t]]+'</div>':''))+'</div>'+(state.finalReleased?'<div class="ok" style="margin-top:15px">O Protocolo Final foi liberado. Reúnam as quatro equipes.</div>':'')+'<p class="small">Não são pedidos nomes, e-mails ou experiências pessoais. Neste ensaio, as informações só são compartilhadas entre abas do mesmo navegador.</p></main>'}
function render(){var r=route();app.innerHTML=r==='telao'?stage():r==='controle'?control():r.startsWith('equipe/')?team(r.split('/')[1]):home()}
function say(){if(!window.speechSynthesis)return alert('Narração não disponível.');speechSynthesis.cancel();var s=new SpeechSynthesisUtterance(S[state.scene][3]);s.lang='pt-BR';s.rate=.92;var vv=speechSynthesis.getVoices();s.voice=vv.find(function(v){return v.lang.toLowerCase()==='pt-br'})||null;speaking=true;document.querySelector('.face')?.classList.add('speaking');s.onend=s.onerror=function(){speaking=false;document.querySelector('.face')?.classList.remove('speaking')};speechSynthesis.speak(s)}
function movie(){var s=S[state.scene],e=document.createElement('div');e.className='movie';e.innerHTML='<div class="movie-inner"><div class="kicker">EVA · SEQUÊNCIA VISUAL '+esc(s[0])+'</div><h2>'+esc(s[1])+'</h2><p class="lead">'+esc(s[2])+'</p>'+btn('Fechar','close','primary')+'<p class="small">Animação de apresentação nesta prévia. Os vídeos MP4 originais estão no pacote do sistema local.</p></div>';document.body.appendChild(e)}
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-action],[data-scene],[data-round],[data-outcome]');if(!el)return;var a=el.dataset.action;if(el.dataset.scene!==undefined){state.scene=+el.dataset.scene;save('Cena '+(state.scene+1))}else if(el.dataset.round!==undefined){state.round=+el.dataset.round;save('Rodada '+state.round+' liberada')}else if(el.dataset.outcome){state.outcome=el.dataset.outcome;save('Desfecho '+state.outcome)}else if(a==='next'){state.scene=Math.min(10,state.scene+1);save('Próxima cena')}else if(a==='prev'){state.scene=Math.max(0,state.scene-1);save('Cena anterior')}else if(a==='collapse'){collapse=!collapse;render()}else if(a==='full'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}else if(a==='voice'){say()}else if(a==='movie'){movie()}else if(a==='close'){document.querySelector('.movie')?.remove()}else if(a==='reset'){if(confirm('Apagar as decisões desta sessão e começar do zero?')){state=newState();save('Nova sessão')}}else if(a==='submit'){var t=route().split('/')[1],n=state.progress[t].findIndex(function(x){return !x})+1,k=t+n,input=document.querySelector('#answer');if(!n||n>state.round||!input)return;var v=normal(input.value);if(hash(v)===H[k]){state.progress[t][n-1]=true;save('Equipe '+t+' completou '+k);var c=document.querySelector('.card');if(c){var div=document.createElement('div');div.className='ok';div.textContent='Arquivo validado! '+C[k];c.appendChild(div)}}else{var f=document.querySelector('#feedback');f.className='alert';f.textContent='Ainda não. Releiam as pistas. Um detalhe muda a interpretação.'}}});
document.addEventListener('change',function(e){if(e.target.dataset.hint){state.hints[e.target.dataset.hint]=+e.target.value;save('Dica atualizada')}else if(e.target.id==='final'){state.finalReleased=e.target.checked;save('Envelope final '+(state.finalReleased?'liberado':'bloqueado'))}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='answer')document.querySelector('[data-action="submit"]')?.click()});
render();
})();
</script></body></html>
