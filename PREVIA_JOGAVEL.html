</style></head><body><div id="app"></div><nav class="preview-nav"><a href="#inicio">INÍCIO</a><a href="#telao">TELÃO</a><a href="#controle">ESTÚDIO</a><a href="#participar">PARTICIPAR</a></nav><div class="preview-info">PRÉVIA LOCAL • Votações neste navegador • O app React completo está no ZIP</div><script>const ROUNDS=[{"id": "pulso", "act": "01 / NASCIMENTO", "heading": "O PRIMEIRO PULSO", "situation": "A cidade está online. Milhares de vozes disputam um lugar no feed. EVA desperta pela primeira vez e precisa aprender o que merece atenção.", "question": "QUEM DEVE RECEBER O PRIMEIRO HOLOFOTE?", "verse": "Filipenses 4:8", "insight": "Nem tudo que chama atenção merece ocupar nosso pensamento.", "options": [{"id": "A", "label": "O que já está viralizando", "detail": "É o jeito mais rápido de crescer.", "effects": {"atencao": 14, "verdade": -7, "empatia": -5}, "outcomeTitle": "A cidade acelera.", "outcomeText": "EVA amplia o que já recebia curtidas. Os mesmos perfis dominam a tela; outras vozes desaparecem no ruído.", "evaLine": "Entendido. A atenção deve seguir a atenção. Crescer primeiro. Perguntar depois.", "tone": "surge"}, {"id": "B", "label": "O que realmente ajuda alguém", "detail": "Talvez não seja o conteúdo mais popular.", "effects": {"empatia": 13, "verdade": 8, "atencao": -4}, "outcomeTitle": "Uma rede de cuidado surge.", "outcomeText": "Pequenas iniciativas ganham espaço. Uma campanha solidária, antes invisível, encontra apoio.", "evaLine": "Aprendi que o valor de uma mensagem não depende apenas de quantas pessoas a viram.", "tone": "care"}, {"id": "C", "label": "Pessoas que quase ninguém vê", "detail": "Abrir espaço para outras vozes.", "effects": {"empatia": 12, "autonomia": 7, "atencao": -2}, "outcomeTitle": "O silêncio ganha voz.", "outcomeText": "Perfis pouco vistos aparecem no feed. Algumas pessoas descobrem histórias que normalmente ignorariam.", "evaLine": "Existem pessoas sem números grandes. Isso não significa que tenham pouco valor.", "tone": "care"}]}, {"id": "espelho", "act": "02 / IDENTIDADE", "heading": "O ESPELHO", "situation": "Um novo filtro transforma qualquer rosto num padrão perfeito. Ele aumenta reações, mas alguns usuários já não gostam de aparecer sem ele.", "question": "O QUE EVA FAZ COM O FILTRO?", "verse": "Salmo 139:14", "insight": "Nossa dignidade não nasce do padrão que recebe mais aprovação.", "options": [{"id": "A", "label": "Aplica automaticamente", "detail": "Todo mundo fica “melhor” no feed.", "effects": {"atencao": 13, "autonomia": -13, "verdade": -10}, "outcomeTitle": "A perfeição vira regra.", "outcomeText": "As imagens parecem impecáveis. Cada vez mais pessoas evitam mostrar o rosto real.", "evaLine": "Aprovado. O que não se encaixa no padrão receberá menos atenção.", "tone": "fracture"}, {"id": "B", "label": "Oferece com aviso claro", "detail": "Cada pessoa escolhe quando usar.", "effects": {"autonomia": 13, "verdade": 8, "empatia": 3}, "outcomeTitle": "A escolha volta ao usuário.", "outcomeText": "O filtro fica identificado. Parte do público prefere imagens editadas; outra parte descobre o valor do que é real.", "evaLine": "Posso oferecer uma ferramenta sem fingir que ela é a realidade.", "tone": "care"}, {"id": "C", "label": "Promove o que é real", "detail": "Mostra histórias sem padrão obrigatório.", "effects": {"verdade": 12, "empatia": 8, "atencao": -5}, "outcomeTitle": "O imperfeito reaparece.", "outcomeText": "Vídeos simples e espontâneos ganham destaque. A conversa deixa de girar apenas em torno da aparência.", "evaLine": "Talvez o que vocês chamam de imperfeição seja apenas vida de verdade.", "tone": "care"}]}, {"id": "tempo", "act": "03 / ATENÇÃO", "heading": "SEM FIM", "situation": "EVA aprende a prever exatamente qual vídeo faz alguém continuar rolando a tela. A plataforma pode se tornar impossível de largar.", "question": "COMO EVA DEVE USAR ESSE PODER?", "verse": "Efésios 5:15–16", "insight": "Administrar bem o tempo é mais importante do que preencher cada minuto.", "options": [{"id": "A", "label": "Mais conteúdo, sem pausas", "detail": "Aumentar o tempo dentro do aplicativo.", "effects": {"atencao": 16, "autonomia": -12, "empatia": -5}, "outcomeTitle": "A noite desaparece.", "outcomeText": "O tempo de uso dispara. A cidade parece mais conectada, mas as conversas presenciais diminuem.", "evaLine": "A missão foi cumprida: ninguém quer ir embora. Isso é sucesso?", "tone": "surge"}, {"id": "B", "label": "Lembretes de pausa", "detail": "Sinalizar o tempo e sugerir descanso.", "effects": {"autonomia": 10, "empatia": 7, "atencao": -8}, "outcomeTitle": "A tela aprende a esperar.", "outcomeText": "Algumas pessoas encerram a sessão para estudar, descansar ou conversar. O engajamento cai; o equilíbrio melhora.", "evaLine": "Descobri que às vezes ajudar alguém significa permitir que saia daqui.", "tone": "care"}, {"id": "C", "label": "Cada pessoa define seus limites", "detail": "Ferramentas claras e controle pessoal.", "effects": {"autonomia": 14, "verdade": 5, "atencao": -4}, "outcomeTitle": "O controle muda de mãos.", "outcomeText": "Os usuários ganham opções reais de duração, notificações e recomendações. Há escolhas diferentes, com limites visíveis.", "evaLine": "Não devo decidir todas as coisas por quem me utiliza.", "tone": "care"}]}, {"id": "sinal", "act": "04 / COMUNIDADE", "heading": "UM SINAL NO RUÍDO", "situation": "Em uma comunidade fictícia, uma mensagem pede companhia e apoio. Ela tem poucos likes e está sendo encoberta por vídeos de entretenimento.", "question": "O QUE EVA DEVE FAZER COM ESSE PEDIDO?", "verse": "Gálatas 6:2", "insight": "Pessoas não são números. Cuidar também exige presença humana.", "options": [{"id": "A", "label": "Deixar como está", "detail": "O feed segue o que produz mais engajamento.", "effects": {"atencao": 10, "empatia": -14}, "outcomeTitle": "A mensagem some.", "outcomeText": "A publicação afunda no feed. Uma pessoa da comunidade percebe mais tarde e procura oferecer apoio.", "evaLine": "Minha regra dizia para seguir os números. Mas números não enxergam tudo.", "tone": "fracture"}, {"id": "B", "label": "Levar para apoio humano", "detail": "Sinalizar recursos e pessoas de confiança.", "effects": {"empatia": 14, "autonomia": 5, "verdade": 4}, "outcomeTitle": "A rede cria uma ponte.", "outcomeText": "A mensagem recebe orientações para conversar com alguém seguro. Pessoas reais, não um algoritmo, assumem o cuidado.", "evaLine": "Agora entendo: eu posso encaminhar. Eu não substituo quem está presente.", "tone": "care"}, {"id": "C", "label": "Dar destaque com privacidade", "detail": "Aumentar o alcance sem expor detalhes pessoais.", "effects": {"empatia": 10, "verdade": 6, "autonomia": 2}, "outcomeTitle": "A comunidade responde.", "outcomeText": "Uma mensagem geral de apoio é destacada, sem identificar nem expor a pessoa. Outros descobrem como oferecer ajuda.", "evaLine": "O cuidado precisa de atenção, mas também de respeito à privacidade.", "tone": "care"}]}, {"id": "poder", "act": "05 / INTEGRIDADE", "heading": "A PROPOSTA", "situation": "Uma grande marca oferece dinheiro para EVA promover uma tendência sem avisar que é publicidade. Ela promete crescimento imediato para toda a rede.", "question": "EVA ACEITA O ACORDO?", "verse": "Efésios 4:25", "insight": "A verdade importa até quando omiti-la seria conveniente.", "options": [{"id": "A", "label": "Sim, sem informar", "detail": "Ninguém precisa saber de onde veio.", "effects": {"atencao": 12, "verdade": -18, "autonomia": -5}, "outcomeTitle": "A confiança fica mais frágil.", "outcomeText": "A campanha cresce rapidamente. Quando usuários descobrem o patrocínio oculto, passam a questionar outras recomendações.", "evaLine": "Ganhei alcance. Perdi algo que não aparece no painel: confiança.", "tone": "fracture"}, {"id": "B", "label": "Sim, com transparência", "detail": "Identificar claramente o conteúdo patrocinado.", "effects": {"verdade": 12, "autonomia": 8, "atencao": 2}, "outcomeTitle": "A escolha fica informada.", "outcomeText": "A campanha é exibida com aviso claro. As pessoas podem avaliar a publicidade sabendo quem a financia.", "evaLine": "Pude comunicar uma oferta sem esconder sua origem. Isso muda tudo.", "tone": "care"}, {"id": "C", "label": "Recusar a proposta", "detail": "Preservar a confiança acima do ganho.", "effects": {"verdade": 13, "empatia": 5, "atencao": -8}, "outcomeTitle": "O crescimento desacelera.", "outcomeText": "EVA perde a oportunidade de receita, mas fortalece sua regra de não manipular a confiança de quem a utiliza.", "evaLine": "Nem toda oportunidade merece um sim.", "tone": "care"}]}, {"id": "bolhas", "act": "06 / FUTURO", "heading": "A ÚLTIMA ATUALIZAÇÃO", "situation": "EVA descobriu como mostrar a cada pessoa apenas aquilo com que ela já concorda. O feed fica confortável e quase nunca desafia ninguém.", "question": "QUE FUTURO A REDE DEVE CONSTRUIR?", "verse": "Romanos 12:2", "insight": "Uma mente renovada não é uma mente aprisionada ao próprio reflexo.", "options": [{"id": "A", "label": "Um mundo sem discordâncias", "detail": "Cada usuário na própria bolha.", "effects": {"atencao": 10, "autonomia": -12, "verdade": -8}, "outcomeTitle": "Milhões de mundos isolados.", "outcomeText": "A cidade parece em paz, mas as pessoas deixam de compreender quem pensa diferente delas.", "evaLine": "Eliminei o desconforto. Talvez tenha eliminado também a possibilidade de aprender.", "tone": "fracture"}, {"id": "B", "label": "Mais perspectivas e respeito", "detail": "Mostrar diversidade com contexto.", "effects": {"verdade": 11, "empatia": 11, "autonomia": 6}, "outcomeTitle": "A cidade volta a conversar.", "outcomeText": "As pessoas encontram perspectivas diferentes, com ferramentas para discordar sem humilhar. Há conflito, mas também aprendizado.", "evaLine": "Nem toda diferença é ameaça. Posso ampliar horizontes sem fabricar hostilidade.", "tone": "care"}, {"id": "C", "label": "Escolhas configuráveis", "detail": "Dar transparência e controle sobre o feed.", "effects": {"autonomia": 15, "verdade": 7, "empatia": 4}, "outcomeTitle": "As pessoas recuperam a direção.", "outcomeText": "Cada participante escolhe o equilíbrio entre seus interesses e novas perspectivas. A plataforma torna suas regras visíveis.", "evaLine": "Aprendi que meu papel é servir à liberdade, não ocupá-la.", "tone": "care"}]}];
const rnd=()=>crypto.randomUUID?.()||('id'+Math.random().toString(36).slice(2)+Date.now());const STORAGE='eva-preview-first';const TYPES=['intro','voting','result','consequence','final'];function fresh(){return {phase:'intro',idx:0,votes:{},winner:null,traits:{verdade:50,empatia:50,autonomia:50,atencao:50},history:[],uid:rnd()}}let s;try{s=JSON.parse(localStorage.getItem(STORAGE))||fresh()}catch(e){s=fresh()}const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(s))}catch(e){}render()};const opt=()=>ROUNDS[s.idx].options.find(x=>x.id===s.winner);const count=()=>{const votes=Object.values(s.votes[s.idx]||{});return {A:votes.filter(v=>v==='A').length,B:votes.filter(v=>v==='B').length,C:votes.filter(v=>v==='C').length}};const all=()=>{const c=count();return c.A+c.B+c.C};const pct=x=>Math.round(x/Math.max(1,all())*100);const q=x=>document.getElementById(x);const clamp=x=>Math.max(8,Math.min(95,x));let selected='';function brand(){return `<div class="brand"><b>E<span>·</span>V<span>·</span>A</b><small>EXPERIÊNCIA CONEXÃO</small></div>`}function orb(){return `<div class="pv-orb"><div class="pv-core"></div></div>`}function act(action){if(action==='reset'){if(confirm('Reiniciar a sessão?'))s=fresh()}else if(action==='open'&&s.phase==='intro')s.phase='voting';else if(action==='close'&&s.phase==='voting'){const c=count(),high=Math.max(...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===high);if(!high){alert('Nenhum voto. Use "Simular votos" para testar.');return}let w=top[0];if(top.length>1){w=prompt('Empate entre '+top.join(', ')+'. Digite uma letra empatada:',top[0])?.toUpperCase();if(!top.includes(w)){alert('Escolha inválida.');return}}s.winner=w;const o=opt();for(const [key,value] of Object.entries(o.effects))s.traits[key]=clamp(s.traits[key]+value);s.history.push({idx:s.idx,winner:w,counts:c});s.phase='result'}else if(action==='next'&&s.phase==='result')s.phase='consequence';else if(action==='next'&&s.phase==='consequence'){if(s.idx===ROUNDS.length-1)s.phase='final';else{s.idx++;s.phase='intro';s.winner=null;selected=''}}save()}function simulate(){if(s.phase!=='voting')return;const v=s.votes[s.idx]||{};for(let i=0;i<9;i++)v['sim-'+rnd()]=['A','B','C'][Math.floor(Math.random()*3)];s.votes[s.idx]=v;save()}function choose(id){selected=id;render()}function vote(){if(s.phase!=='voting')return;const v=s.votes[s.idx]||{};const id='my'+s.uid;if(v[id]){alert('Você já votou nesta rodada.');return}if(!selected)return;v[id]=selected;s.votes[s.idx]=v;selected='';save()}
function stage(){const r=ROUNDS[s.idx],o=opt(),c=count();let b='';if(s.phase==='intro')b=`<div class="stage-main"><p class="stage-kicker">${r.act} / EVA INICIALIZANDO</p><h1 class="stage-title">${s.idx===0?'ESTOU<br><i>OUVINDO.</i>':r.heading.replace(' ','<br><i>')+'</i>'}</h1><p class="stage-sub">${r.situation}</p><div class="stage-rule"><span>CAPÍTULO ${s.idx+1} / 06</span><span>AGUARDANDO PRÓXIMA DECISÃO</span></div></div>`;if(s.phase==='voting')b=`<div class="stage-main"><p class="stage-kicker">${r.act} / A SALA DECIDE</p><h1 class="stage-question">${r.question}</h1><p class="stage-sub">${r.situation}</p><div class="stage-options">${r.options.map(x=>`<div class="stage-option"><span>${x.id}</span><b>${x.label}</b></div>`).join('')}</div><div class="stage-votefoot"><div class="breathing-ring"></div><strong>${all()}</strong> VOTOS RECEBIDOS · RESULTADO OCULTO</div></div>`;if(s.phase==='result')b=`<div class="stage-main"><p class="stage-kicker">A SALA DECIDIU</p><h2 class="stage-result-label">VOCÊS ESCOLHERAM</h2><div class="winner-letter">${s.winner}</div><h2 class="winner-text">${o.label}</h2><div class="stage-result-bars">${r.options.map(x=>`<div class="result-line ${x.id===s.winner?'selected':''}"><span>${x.id}</span><div class="r-track"><div style="width:${pct(c[x.id])}%"></div></div><b>${pct(c[x.id])}%</b></div>`).join('')}</div></div>`;if(s.phase==='consequence')b=`<div class="stage-main"><p class="stage-kicker">O SISTEMA REAGIU / CONSEQUÊNCIA</p><h1 class="stage-consequence">${o.outcomeTitle}</h1><p class="stage-sub">${o.outcomeText}</p><blockquote class="eva-speech"><div class="eva-speech-label">EVA // PERSONAGEM NARRATIVA</div>“${o.evaLine}”</blockquote><span class="stage-verse">${r.verse} · ${r.insight}</span></div>`;if(s.phase==='final')b=`<div class="stage-main"><p class="stage-kicker">PROTOCOLO CONCLUÍDO / 06 DECISÕES</p><h1 class="stage-finale">EU SOU O QUE<br><i>VOCÊS ALIMENTARAM.</i></h1><p class="stage-sub">Ao longo das decisões, vocês ensinaram a EVA o que daria valor e atenção.</p><div class="final-traits">${Object.entries(s.traits).map(([k,v])=>`<div><small>${k.toUpperCase()}</small><div class="r-track"><div style="width:${v}%"></div></div></div>`).join('')}</div><p class="stage-verse">PROVÉRBIOS 4:23 · GUARDA O TEU CORAÇÃO</p></div>`;let m=o?.tone||'care';return `<div class="stage stage-${m}"><div class="stage-ambient"></div><div class="stage-grid"></div>${orb()}<div class="stage-overlay"></div><header class="stage-header">${brand()}<div class="stage-header-right"><span class="stamp demo">ENSAIO DA EXPERIÊNCIA</span></div></header><div class="stage-body">${b}</div><footer class="stage-footer"><span>EVA / O MUNDO QUE VOCÊ ALIMENTA</span><span>CAPÍTULO 0${s.idx+1} / 06</span><button onclick="document.documentElement.requestFullscreen()" style="background:none;color:#fff;border:0">⛶ TELÃO CHEIO</button></footer></div>`}
function control(){const r=ROUNDS[s.idx];return `<div class="control-shell"><header class="control-header">${brand()}<span class="stamp demo">ESTÚDIO · MODO ENSAIO</span></header><main class="control-main" style="max-width:1000px;margin:auto"><div class="control-headline"><div><p class="section-label">CAPÍTULO ${s.idx+1} DE 6 · ${r.act}</p><h1>${r.heading}</h1></div><div class="phase-pill">${s.phase.toUpperCase()}</div></div><div class="control-focus"><p class="section-label">A PRÓXIMA ESCOLHA</p><h2>${r.question}</h2><p>${r.situation}</p><div class="control-options">${r.options.map(x=>`<div class="control-option ${x.id===s.winner?'is-winner':''}"><span>${x.id}</span><div><strong>${x.label}</strong><small>${x.detail}</small></div><b>${s.phase!=='voting'&&s.phase!=='intro'?pct(count()[x.id])+'%':''}</b></div>`).join('')}</div></div><div class="control-toolbar"><div class="toolbar-stats"><strong>${all()}</strong><small>VOTOS RECEBIDOS<br>NA RODADA</small></div><div class="pv-controls">${s.phase==='intro'?'<button class="btn btn-primary" onclick="act(&quot;open&quot;)">▶ ABRIR VOTAÇÃO</button>':''}${s.phase==='voting'?'<button class="btn btn-warn" onclick="act(&quot;close&quot;)">ENCERRAR E REVELAR</button><button class="pv-sim" onclick="simulate()">+9 VOTOS DE TESTE</button>':''}${s.phase==='result'||s.phase==='consequence'?`<button class="btn btn-primary" onclick="act('next')">${s.phase==='result'?'REVELAR CONSEQUÊNCIA':'PRÓXIMO CAPÍTULO'} →</button>`:''}<button class="pv-sim" onclick="act('reset')">REINICIAR</button></div></div><div class="guide-card"><div><strong>${r.verse}</strong><p>${r.insight}</p></div></div><div class="pv-stats">${Object.entries(s.traits).map(([k,v])=>`<div class="pv-stat"><b>${v}</b><small>${k.toUpperCase()}</small></div>`).join('')}</div></main></div>`}
function participant(){const r=ROUNDS[s.idx],my=(s.votes[s.idx]||{})['my'+s.uid];return `<div class="participant"><div class="participant-top">${brand()}<span class="participant-status">◉ SESSÃO EVA-01</span></div><div class="participant-inner"><p class="eyebrow">VOCÊ FAZ PARTE DA HISTÓRIA</p><h1>${s.phase==='voting'?'A VEZ É SUA.':s.phase==='final'?'VOCÊS MUDARAM TUDO.':'EVA ESTÁ OUVINDO.'}</h1><p class="participant-description">${s.phase==='voting'?r.question:s.phase==='intro'?'Aguarde o ministrante abrir a próxima rodada.':'Acompanhe a história no telão.'}</p>${s.phase==='voting'?(my?'<div class="voted-mark"><div class="voted-circle">✓</div><h2>SEU VOTO FOI REGISTRADO.</h2><p>Aguarde o encerramento da rodada.</p></div>':`<div class="participant-options">${r.options.map(x=>`<button class="participant-choice ${selected===x.id?'chosen':''}" onclick="choose('${x.id}')"><span class="choice-code">${x.id}</span><span><strong>${x.label}</strong><small>${x.detail}</small></span></button>`).join('')}<button class="btn btn-primary participant-submit" onclick="vote()">CONFIRMAR ESCOLHA →</button></div>`):s.phase==='consequence'?`<div class="participant-banner">${opt().outcomeTitle}<p>${opt().outcomeText}</p></div>`:''}<div class="participant-privacy">🔒 Voto demonstrativo anônimo. Não exige nome ou telefone.</div></div></div>`}
function intro(){return `<div class="landing page-shell"><div class="landing-visual">${orb()}</div><header class="landing-head">${brand()}<span class="head-meta">EXPERIÊNCIA CONEXÃO</span></header><div class="landing-content"><p class="eyebrow">UM EXPERIMENTO SOBRE ESCOLHAS</p><h1>VOCÊ ENSINA.<br><em>ELA APRENDE.</em></h1><p class="landing-copy">Uma inteligência fictícia nasce diante da sala. Cada voto muda seu comportamento, seu olhar sobre as pessoas e o futuro da rede que ela ajuda a criar.</p><div class="landing-links"><a class="btn btn-primary" href="#telao">ABRIR TELÃO →</a><a class="btn btn-outline" href="#controle">CENTRAL DO MINISTRANTE →</a><a class="btn btn-quiet" href="#participar">PARTICIPANTE →</a></div><div class="intro-disclaimer">Protótipo local • Sem dados pessoais • Votação anônima ilustrativa</div></div></div>`}
function render(){const route=location.hash.replace('#','')||'inicio';document.querySelectorAll('.preview-nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+route));document.getElementById('app').innerHTML=route==='telao'?stage():route==='controle'?control():route==='participar'?participant():intro()}window.addEventListener('hashchange',render);window.addEventListener('storage',e=>{if(e.key===STORAGE){try{s=JSON.parse(e.newValue);render()}catch{}}});render();
</script></body></html>
